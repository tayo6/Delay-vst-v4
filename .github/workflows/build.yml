name: Build Delay Plugin VST3 (Windows)

on: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Configure CMake
      # Explicitly use the 64-bit Visual Studio generator available on windows-latest
      run: cmake -B build -A x64

    - name: Build VST3
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DelayPlugin-VST3-Windows
        path: build/DelayPlugin_artefacts/Release/VST3/Delay Plugin.vst3
